<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="quiz-box">
    <h2>Online Quiz</h2>
    <form action="QuizServlet" method="post">

        <div class="question">
            <p>1. What does CPU stand for?</p>
            <input type="radio" name="q1" value="A"> Central Process Unit<br>
            <input type="radio" name="q1" value="B"> Central Processing Unit<br>
            <input type="radio" name="q1" value="C"> Computer Personal Unit<br>
            <input type="radio" name="q1" value="D"> Core Processing Unit<br>
        </div>

        <div class="question">
            <p>2. Which language is used for web pages?</p>
            <input type="radio" name="q2" value="A"> Java<br>
            <input type="radio" name="q2" value="B"> Python<br>
            <input type="radio" name="q2" value="C"> HTML<br>
            <input type="radio" name="q2" value="D"> C++<br>
        </div>

        <button type="submit">Submit Quiz</button>
    </form>
</div>

</body>
</html>
